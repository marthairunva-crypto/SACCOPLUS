name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'
      
      - name: Flutter Doctor
        run: flutter doctor -v
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows Release
        run: |
          # Set CMake policies to avoid deprecation warnings
          $env:CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
          $env:CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"
          flutter build windows --release --verbose
      
      - name: List build output (for debugging)
        run: |
          Write-Host "Build output structure:"
          Get-ChildItem -Path build\windows -Recurse -Depth 3 | Select-Object FullName
      
      - name: Create Portable ZIP
        run: |
          $releasePath = Get-ChildItem -Path "build\windows" -Recurse -Filter "Release" -Directory | Select-Object -First 1 -ExpandProperty FullName
          if ($releasePath) {
            Write-Host "Found Release folder at: $releasePath"
            Compress-Archive -Path "$releasePath\*" -DestinationPath "MBADIFA_SACCO_Portable.zip" -Force
          } else {
            Write-Error "Release folder not found"
            exit 1
          }
      
      - name: Upload Windows Portable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MBADIFA-SACCO-Portable
          path: MBADIFA_SACCO_Portable.zip
          retention-days: 90
      
      - name: Create Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MBADIFA SACCO v1.0.${{ github.run_number }}
          body: |
            ## MBADIFA SACCO - Portable Windows Version
            
            **Installation Instructions:**
            1. Download `MBADIFA_SACCO_Portable.zip`
            2. Extract to any folder (e.g., `C:\MBADIFA SACCO\`)
            3. Run `saccoplus_pro.exe`
            4. (Optional) Create a desktop shortcut by right-clicking `saccoplus_pro.exe` → Send to → Desktop
            
            **Features:**
            - No installation required
            - Run from any location
            - All dependencies included
            
            **Version:** v1.0.${{ github.run_number }}
          files: MBADIFA_SACCO_Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
