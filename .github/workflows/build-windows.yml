name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'
      
      - name: Flutter Doctor
        run: flutter doctor -v
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows Release
        run: |
          # Set CMake policies to avoid deprecation warnings
          $env:CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
          $env:CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"
          flutter build windows --release --verbose
      
      - name: List build output (for debugging)
        run: |
          Write-Host "Build output structure:"
          Get-ChildItem -Path build\windows -Recurse -Depth 4 | Where-Object { $_.Name -eq "saccoplus_pro.exe" -or $_.PSIsContainer } | Select-Object FullName
      
      - name: Create Portable ZIP
        run: |
          # Find the actual Release folder containing the EXE
          $exePath = Get-ChildItem -Path "build\windows" -Recurse -Filter "saccoplus_pro.exe" | Select-Object -First 1 -ExpandProperty FullName
          if ($exePath) {
            $releaseFolder = Split-Path $exePath -Parent
            Write-Host "Found EXE at: $exePath"
            Write-Host "Release folder: $releaseFolder"
            Compress-Archive -Path "$releaseFolder\*" -DestinationPath "MBADIFA_SACCO_Portable.zip" -Force
            Write-Host "ZIP created successfully"
          } else {
            Write-Error "saccoplus_pro.exe not found in build output"
            exit 1
          }
      
      - name: Upload Windows Portable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MBADIFA-SACCO-Portable
          path: MBADIFA_SACCO_Portable.zip
          retention-days: 90
