name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Patch Firebase CMake for compatibility
        run: |
          flutter build windows --release
        continue-on-error: true
      
      - name: Fix Firebase CMakeLists.txt
        run: |
          $cmakeFile = "build/windows/x64/extracted/firebase_cpp_sdk_windows/CMakeLists.txt"
          if (Test-Path $cmakeFile) {
            (Get-Content $cmakeFile) -replace 'cmake_minimum_required\(VERSION 3\.1\)', 'cmake_minimum_required(VERSION 3.5)' | Set-Content $cmakeFile
          }
      
      - name: Build Windows Release
        run: flutter build windows --release
      
      - name: Create ZIP of Release
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath saccoplus-windows.zip
      
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SACCOPLUS-Windows
          path: saccoplus-windows.zip
          retention-days: 30
