name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'
      
      - name: Flutter Doctor
        run: flutter doctor -v
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows Release
        run: flutter build windows --release --verbose
      
      - name: List build output (for debugging)
        run: |
          Write-Host "=== Build output structure ==="
          Get-ChildItem -Path build\windows\x64\runner\Release -Force | Select-Object Name, Length
          Write-Host ""
          Write-Host "=== Searching for EXE files ==="
          Get-ChildItem -Path build\windows -Recurse -Filter "*.exe" | Select-Object FullName
      
      - name: Create Portable ZIP
        run: |
          $releaseFolder = "build\windows\x64\runner\Release"
          if (Test-Path $releaseFolder) {
            Write-Host "Release folder exists at: $releaseFolder"
            Get-ChildItem $releaseFolder | Select-Object Name
            Compress-Archive -Path "$releaseFolder\*" -DestinationPath "MBADIFA_SACCO_Portable.zip" -Force
            if (Test-Path "MBADIFA_SACCO_Portable.zip") {
              $zipSize = (Get-Item "MBADIFA_SACCO_Portable.zip").Length / 1MB
              Write-Host "ZIP file size: $([math]::Round($zipSize, 2)) MB"
            }
          } else {
            Write-Error "Release folder not found at: $releaseFolder"
            exit 1
          }
      
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## MBADIFA SACCO System - Windows Build
            
            ### 🎉 What's New in This Release:
            
            **✨ Subscription Management System**
            - In-app subscription manager (Settings → Manage Subscription)
            - Auto-lock system when subscription expires
            - Warning banner shows 7 days before expiry
            - SMS alerts sent 2 days before expiry
            - Plans: Starter (100K), Growth (350K), Enterprise (750K)
            
            **🐛 Bug Fixes**
            - Fixed "Cash from bank" internal transfers counted as revenue
            - Fixed till session display for internal transfers
            - Fixed Income Report to exclude internal transfers
            
            **🎨 UI Improvements**
            - Rebuilt Bank Transfers screen (Mobile Money style)
            - Added Edit Balance feature for bank accounts
            - Clean warning banners and notifications
            
            ### 📥 Download and Installation:
            1. Download `MBADIFA_SACCO_Portable.zip`
            2. Extract the ZIP file
            3. Run `saccoplus_pro.exe`
            
            ### 🔧 System Requirements:
            - Windows 10/11 (64-bit)
            - 4GB RAM minimum
            - Internet connection for Firebase sync
          files: MBADIFA_SACCO_Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
