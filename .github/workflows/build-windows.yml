name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'
      
      - name: Flutter Doctor
        run: flutter doctor -v
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows Release
        run: |
          # Set CMake policies to avoid deprecation warnings
          $env:CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
          $env:CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"
          flutter build windows --release --verbose
      
      - name: Install Inno Setup
        run: |
          choco install innosetup -y
      
      - name: Create Installer with Inno Setup
        run: |
          $innoSetupPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $innoSetupPath "windows\installer\setup.iss"
      
      - name: Upload Windows Installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MBADIFA-SACCO-Installer
          path: build\windows\installer\MBADIFA_SACCO_Setup.exe
          retention-days: 90
      
      - name: Create Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MBADIFA SACCO v1.0.${{ github.run_number }}
          files: build\windows\installer\MBADIFA_SACCO_Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
